<body class="bg-surface-base font-body-md text-on-surface min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<div class="absolute inset-0 pointer-events-none opacity-[0.15] bg-[radial-gradient(ellipse_at_top,_#6366F1_0%,_transparent_60%)]"></div>
<div class="relative w-full max-w-[380px] flex flex-col gap-lg">
<div class="flex flex-col items-center gap-sm">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[26px]">blur_on</span>
</div>
<div class="text-center">
<h1 class="font-headline-md text-headline-md text-text-primary tracking-tight">SOMN Studio</h1>
<p class="font-body-md text-body-md text-text-secondary mt-1">Enter the studio password to continue.</p>
</div>
</div>
<form id="login-form" class="bg-surface-elevated border border-border-subtle rounded-xl p-lg flex flex-col gap-md" autocomplete="off">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-text-secondary uppercase tracking-widest" for="password">Password</label>
<div class="relative">
<input autocomplete="current-password" class="w-full bg-surface-base border border-border-subtle rounded px-md py-sm pr-[42px] text-body-md text-text-primary placeholder-[#52525B] focus:outline-none focus:border-status-assigned focus:ring-2 focus:ring-status-assigned/30 transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Show password" class="absolute right-0 top-0 h-full px-sm text-text-secondary hover:text-text-primary transition-colors" id="toggle-password" tabindex="-1" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<div class="hidden text-body-md text-[13px] text-status-revision bg-status-revision/10 border border-status-revision/30 rounded px-sm py-xs" id="login-error"></div>
<button class="bg-primary text-on-primary rounded px-md py-sm font-headline-sm text-headline-sm hover:bg-surface-tint transition-colors flex items-center justify-center gap-xs disabled:opacity-60 disabled:cursor-not-allowed" id="login-submit" type="submit">
<span id="login-submit-label">Enter Studio</span>
</button>
</form>
<p class="text-center font-mono-sm text-mono-sm text-text-secondary">Shared studio access · SOMN Studio OS</p>
</div>
<script src="/login.js"></script>
</body>
